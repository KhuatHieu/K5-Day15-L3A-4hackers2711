# Mô phỏng chi phí khi dùng thật — cấu hình 27/11/2026 của Thông.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# PowerShell: $env:MODEL_NAME = 'gemini-3.1-flash-lite'
# Token thực đo bằng Flash-Lite; Pro chỉ là so sánh giá trên cùng token.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 3000
  base: 30000
  high: 300000
  source: "MoMo hơn 30 triệu người dùng: https://www.momo.vn/tin-tuc/thong-cao-bao-chi/momo-dong-hanh-ngay-tai-chinh-so-2026-khang-dinh-8835 (xem 27/11/2026). Lấy nền 30 triệu; tỉ lệ tiếp cận 0,01% / 0,1% / 1% (tự ước tính), không phải khách hàng đã có. Không cộng ZaloPay để tránh trùng."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.36363636363636365  # 12/33 từ bản khảo sát tạm
    uses_per_month: 1       # (tự ước tính)
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "results.csv tạm, câu 4: 9 người chọn 0 + 3 không nhớ = 12/33; gộp không nhớ vào nhóm ít là giả định. 1 phiên/tháng, 1 lượt/phiên (tự ước tính). Câu 3: 23 Có, 5 Không, 5 Không chắc; chưa đủ suy ra tần suất dùng sản phẩm."
  - name: dung_vua
    share: 0.3939393939393939
    uses_per_month: 4
    turns_per_session: 1
    source: "results.csv tạm, câu 4: 13/33 gặp 1 lần trong 3 tháng. 4 phiên/tháng, 1 lượt/phiên (tự ước tính). Câu 4 không đo số phiên dùng sản phẩm tương lai."
  - name: dung_nhieu
    share: 0.24242424242424243
    uses_per_month: 12
    turns_per_session: 1
    source: "results.csv tạm, câu 4: 5 người gặp 2 lần + 3 người gặp 3 lần trở lên = 8/33. 12 phiên/tháng, 1 lượt/phiên (tự ước tính). Mẫu chưa chốt thành viên nhóm / trùng."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing#gemini-3.1-flash-lite · Standard trả phí, text, output gồm thinking · xem 27/11/2026"
  - model: gemini-3.1-pro-preview
    input: 2.00
    output: 12.00
    source: "https://ai.google.dev/gemini-api/docs/pricing#gemini-3.1-pro-preview · Standard, prompt <=200k token, output gồm thinking · xem 27/11/2026; chỉ so sánh giá trên token Flash-Lite"
  # K3 · Long 28/11: model chạy lượt 2 (run-2@20261128-113802) + một mức rẻ cùng hãng để so sánh.
  - model: gpt-6.2-sol
    input: 2.00
    output: 10.00
    source: "further-reading/model-prices.md của repo đề (BTC tra 25/11/2026) · https://developers.openai.com/api/docs/pricing · Standard, short context, tầng gợi ý Lớn · model chạy lượt 2"
  - model: gpt-6-luna
    input: 0.10
    output: 0.50
    source: "further-reading/model-prices.md của repo đề (BTC tra 25/11/2026) · https://developers.openai.com/api/docs/pricing · Standard, short context ≤272K token vào, tầng gợi ý Nhỏ · chỉ so sánh giá, chưa chạy eval"

# Chỉ báo cáo bằng USD theo yêu cầu của Thông, không quy đổi tiền Việt.
